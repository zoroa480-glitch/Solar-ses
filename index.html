<script>

['عطارد',.387,87.97,4879,.33,1407.6,'0',167,3.7,'شبه معدوم','كوكب صخري','أسرع الكواكب دورانًا حول الشمس: سنته 88 يومًا أرضيًا.','#9a948c','#5d5852','r',0],

const S={orbits:1,labels:1,info:1,edu:1,q:1};let mode='solar',sel=null,t=275,spd=100/24,dir=1,playing=true,moonOff=0,earthManual=false,gSel=2,fSel=4,cmp=[2,4],cmpE=false;

const rn=new T3.WebGLRenderer({antialias:true,powerPreference:'high-performance'}),app=$('app');app.insertBefore(rn.domElement,app.firstChild);

function tex(c1,c2,k,s){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,256,128);const r=()=>(s=(s*16807)%2147483647)/2147483647;
if(k=='g'){for(let y=0;y<128;y+=3){x.globalAlpha=.15+r()*.5;x.fillStyle=r()>.5?c2:c1;x.fillRect(0,y,256,2+r()*7)}}
else{x.fillStyle=c2;for(let i=0;i<(k=='e'?45:100);i++){x.globalAlpha=k=='e'?.95:.3;x.beginPath();x.ellipse(r()*256,r()*128,3+r()*(k=='e'?22:9),2+r()*(k=='e'?11:6),r()*3,0,7);x.fill()}}
if(k=='e'){x.globalAlpha=.9;x.fillStyle='#fff';x.fillRect(0,0,256,6);x.fillRect(0,122,256,6)}return new T3.CanvasTexture(c)}

const sunM=new T3.Mesh(new T3.SphereGeometry(1,32,24),new T3.MeshBasicMaterial({color:0xffd27a}));scene.add(sunM);
const sg=new T3.Sprite(new T3.SpriteMaterial({map:glow(),blending:T3.AdditiveBlending,depthWrite:false}));scene.add(sg);
const hitG=new T3.SphereGeometry(1,8,6),hitM=new T3.MeshBasicMaterial({visible:false}),hits=[];

const sunHit=mkHit(sunM,'s');
const planets=D.map((x,i)=>{const p={i,n:x[0],a:x[1],T:x[2],d:x[3],m:x[4],r:x[5],mo:x[6],t:x[7],g:x[8],at:x[9],ty:x[10],f:x[11],rad:Math.pow(x[3]/12756,.55),sm:1,ph0:i==2?0:i*1.3+.5};p.ph=p.ph0;
const o=new T3.Group(),tl=new T3.Group();tl.rotation.z=-x[15]*PI/180;
const m=new T3.Mesh(new T3.SphereGeometry(p.rad,32,24),new T3.MeshStandardMaterial({map:tex(x[12],x[13],x[14],i*37+11),roughness:1}));tl.add(m);o.add(tl);
if(i==5){const rg=new T3.Mesh(new T3.RingGeometry(p.rad*1.3,p.rad*2.3,64),new T3.MeshBasicMaterial({color:0xcdb98a,side:2,transparent:true,opacity:.75}));rg.rotation.x=-PI/2;tl.add(rg)}
if(i==2||i==1)o.add(new T3.Mesh(new T3.SphereGeometry(p.rad*1.07,32,24),new T3.MeshBasicMaterial({color:i==2?0x5cb8ff:0xe8c76a,transparent:true,opacity:.2,side:T3.BackSide})));
p.o=o;p.tl=tl;p.mesh=m;p.hit=mkHit(o,i);scene.add(o);
const l=document.createElement('div');l.className='lb';l.textContent=p.n;$('lbs').appendChild(l);p.lb=l;return p});
const earth=planets[2];
const moon=new T3.Mesh(new T3.SphereGeometry(MOON.rad,24,16),new T3.MeshStandardMaterial({map:tex('#a9a9a9','#6e6e6e','r',5),roughness:1}));scene.add(moon);const moonHit=mkHit(moon,'m');
const mlb=document.createElement('div'),slb=document.createElement('div');mlb.className=slb.className='lb';mlb.textContent='القمر';slb.textContent='الشمس';$('lbs').append(mlb,slb);
// guides on Earth
const gd={ax:new T3.Group(),eq:new T3.Group(),tr:new T3.Group(),po:new T3.Group()};
function circ(lat,col){const r=earth.rad*1.01,a=lat*PI/180,pts=[];for(let k=0;k<=64;k++){const u=k/64*2*PI;pts.push(new T3.Vector3(Math.cos(a)*r*Math.cos(u),Math.sin(a)*r,Math.cos(a)*r*Math.sin(u)))}return new T3.Line(new T3.BufferGeometry().setFromPoints(pts),new T3.LineBasicMaterial({color:col}))}
gd.ax.add(new T3.Line(new T3.BufferGeometry().setFromPoints([new T3.Vector3(0,-2.2,0),new T3.Vector3(0,2.2,0)]),new T3.LineBasicMaterial({color:0xff5577})));
gd.eq.add(circ(0,0xffffff));[23.44,-23.44].forEach(a=>gd.tr.add(circ(a,0xffb454)));[66.56,-66.56].forEach(a=>gd.po.add(circ(a,0x62e1ff)));
Object.values(gd).forEach(g=>earth.tl.add(g));
// orbits, belt, stars
const orbG=new T3.Group();scene.add(orbG);let belt=null;
const R=i=>S.edu?14+i*8.5:14+D[i][1]*11;
function buildOrbits(){orbG.clear();D.forEach((x,i)=>{const pts=[];for(let k=0;k<=128;k++){const u=k/128*2*PI;pts.push(new T3.Vector3(R(i)*Math.cos(u),0,R(i)*Math.sin(u)))}orbG.add(new T3.Line(new T3.BufferGeometry().setFromPoints(pts),new T3.LineBasicMaterial({color:0x3a4a8a,transparent:true,opacity:.7})))});
if(belt)scene.remove(belt);const n=[300,800,1800][S.q],a=new Float32Array(n*3);for(let k=0;k<n;k++){const r=R(3)+(R(4)-R(3))*(.3+.4*Math.random()),u=Math.random()*2*PI;a.set([r*Math.cos(u),(Math.random()-.5)*1.5,r*Math.sin(u)],k*3)}
const g=new T3.BufferGeometry();g.setAttribute('position',new T3.BufferAttribute(a,3));belt=new T3.Points(g,new T3.PointsMaterial({color:0xa89c8a,size:.45}));scene.add(belt);vis()}
let stars=null;function buildStars(){if(stars)scene.remove(stars);const n=[800,1800,3500][S.q],a=new Float32Array(n*3);for(let k=0;k<n;k++){const v=new T3.Vector3().randomDirection?0:0;const u=Math.random()*2*PI,w=Math.acos(2*Math.random()-1);a.set([1500*Math.sin(w)*Math.cos(u),1500*Math.cos(w),1500*Math.sin(w)*Math.sin(u)],k*3)}
const g=new T3.BufferGeometry();g.setAttribute('position',new T3.BufferAttribute(a,3));stars=new T3.Points(g,new T3.PointsMaterial({color:0xffffff,size:1.5,sizeAttenuation:false}));scene.add(stars)}
// shadows (eclipse)

const cMU=cone(.35,.001,3.3,0x000000,.6),cMP=cone(.35,1.67,6,0x9aa8ff,.22),cEU=cone(1.6,.001,5.33,0x000000,.6),cEP=cone(1.6,2.98,6,0x9aa8ff,.22);

const sunRay=new T3.Line(new T3.BufferGeometry().setFromPoints([new T3.Vector3(),new T3.Vector3(1,0,0)]),new T3.LineBasicMaterial({color:0xffd27a}));sunRay.visible=false;scene.add(sunRay);
// ---------- camera ----------
const C={th:.6,ph:1.0,d:150,gd:150,tg:new T3.Vector3(),f:null,min:2};
const defD=()=>S.edu?150:420;
function focus(o,rad,ph){C.f=o;C.min=rad*1.6;C.gd=rad*5;if(ph)C.ph=ph}
function zoom(f){C.gd=Math.min(900,Math.max(C.min,C.gd*f))}
const cv=rn.domElement,ptrs=new Map(),mouse=new T3.Vector2(),ray=new T3.Raycaster();let moved=0,pd=0;

cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=ptrs.size==2?d2():0});
cv.addEventListener('pointermove',e=>{const o=ptrs.get(e.pointerId);if(!o)return;const dx=e.clientX-o[0],dy=e.clientY-o[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);

const h=ray.intersectObjects(hits.filter(m=>m.parent.visible),false)[0];if(h)choose(h.object.userData.id)}
const objOf=id=>id=='s'?sunM:id=='m'?moon:planets[id].o;
const radOf=id=>id=='s'?6:id=='m'?MOON.rad*moon.scale.x:planets[id].rad*planets[id].o.scale.x;
